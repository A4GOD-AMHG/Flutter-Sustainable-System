name: sustainable_system
description: Aplicación para evaluar la sostenibilidad de un software mediante métricas y factores.

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  get: ^4.7.2
  font_awesome_flutter: ^10.8.0
  feature_discovery: ^0.14.1
  syncfusion_flutter_pdf: ^28.1.33
  animate_do: ^3.3.4
  shared_preferences: ^2.5.3
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
